name: Qdrant keep-alive

on:
  schedule:
    # Runs every 3 days at 09:00 UTC (keeps cluster active safely under 7-day limit)
    - cron: "0 9 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Qdrant cluster
        run: |
          # Strip trailing slash if present, then query /collections
          URL="${QDRANT_URL%/}/collections"
          curl -sf -o /dev/null -H "api-key: ${QDRANT_API_KEY}" "$URL"
        env:
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}